<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Screen Mirror</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root {
      --bg: #000D1D;
      --card: rgba(8, 25, 45, 0.88);
      --blue: #148DFF;
      --blue-dark: #0265C2;
      --blue-soft: #9EC7F9;
      --text: #FFFFFF;
      --muted: #8FA6BF;
      --error: #FF6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(1200px 700px at 12% -8%, rgba(20, 141, 255, 0.28), transparent 55%),
        radial-gradient(900px 600px at 108% 8%, rgba(2, 101, 194, 0.32), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Idle / status card */
    #waiting {
      max-width: 760px;
      padding: 3rem 2.75rem;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(2, 101, 194, 0.28);
    }
    .brand-mark {
      width: 76px;
      height: 76px;
      margin-bottom: 1.4rem;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      box-shadow: 0 10px 30px rgba(20, 141, 255, 0.4);
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 19px;
      border: 3px solid #fff;
      border-radius: 8px;
    }
    .eyebrow {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 0.7rem;
    }
    #title { font-size: 3rem; font-weight: 700; margin-bottom: 0.7rem; }
    #subtitle { color: var(--muted); font-size: 1.25rem; line-height: 1.45; margin-bottom: 1.4rem; }
    #status { display: flex; align-items: center; gap: 0.9rem; color: var(--blue-soft); font-size: 1.15rem; min-height: 1.6rem; }
    #status.error { color: var(--error); }
    #spinner {
      display: none;
      width: 22px;
      height: 22px;
      flex: none;
      border: 3px solid rgba(158, 199, 249, 0.25);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #spinner.on { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Live mirror */
    #stage {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }
    #mirror {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #live-badge {
      position: fixed;
      left: 50%;
      bottom: 1.8rem;
      transform: translateX(-50%);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #live-badge.show { opacity: 1; }
    #overlay {
      position: fixed;
      left: 50%;
      top: 1.6rem;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      background: rgba(0, 13, 29, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--blue-soft);
      font-size: 1rem;
      pointer-events: none;
    }
    #overlay.show { display: flex; }
  </style>
</head>
<body>
  <div id="waiting">
    <div class="brand-mark" aria-hidden="true"></div>
    <p class="eyebrow">Screen Mirror</p>
    <h1 id="title">Ready on this TV</h1>
    <p id="subtitle">Your iPhone screen will appear here.</p>
    <div id="status"><span id="spinner"></span><span id="status-text">Open Screen Mirror on your iPhone and start mirroring.</span></div>
  </div>

  <div id="stage">
    <img id="mirror" alt="Live mirror">
    <div id="overlay"><span id="overlay-text"></span></div>
    <div id="live-badge">Live</div>
  </div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.screenmirror.live';

    const COPY = {
      idle: 'Open Screen Mirror on your iPhone and start mirroring.',
      connecting: 'Connecting to your iPhone…',
      waitingFrame: 'Waiting for the first frame…',
      reconnecting: 'Reconnecting to your iPhone…',
      stopped: 'Mirroring stopped. Start again from your iPhone.',
      failed: 'Could not load the phone stream. Check that both devices are on the same Wi-Fi.',
      phoneAway: 'Your iPhone disconnected. Mirroring will resume if it comes back.',
    };

    const MAX_RETRIES = 20;
    const RETRY_BASE_MS = 500;
    const RETRY_MAX_MS = 3000;
    const STALL_CHECK_MS = 4000;

    const context = cast.framework.CastReceiverContext.getInstance();
    const waiting = document.getElementById('waiting');
    const stage = document.getElementById('stage');
    const mirror = document.getElementById('mirror');
    const liveBadge = document.getElementById('live-badge');
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const statusText = document.getElementById('status-text');
    const statusBox = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');

    let streamURL = null;
    let generation = 0;
    let retries = 0;
    let retryTimer = null;
    let stallTimer = null;
    let badgeTimer = null;
    let gotFrame = false;
    let stopRequested = true;

    function setCard(titleText, subtitleText, text, { busy = false, error = false } = {}) {
      title.textContent = titleText;
      subtitle.textContent = subtitleText;
      statusText.textContent = text;
      statusBox.classList.toggle('error', error);
      spinner.classList.toggle('on', busy);
    }

    function showCard() {
      stage.style.display = 'none';
      waiting.style.display = 'block';
    }

    function showStage() {
      waiting.style.display = 'none';
      stage.style.display = 'block';
    }

    function setOverlay(text) {
      if (text) {
        overlayText.textContent = text;
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function clearTimers() {
      clearTimeout(retryTimer);
      clearInterval(stallTimer);
      clearTimeout(badgeTimer);
      retryTimer = stallTimer = badgeTimer = null;
    }

    function withCacheBust(url) {
      return url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
    }

    function sendToPhone(payload) {
      try { context.sendCustomMessage(NAMESPACE, undefined, payload); } catch (e) { /* sender may be gone */ }
    }

    function loadStream() {
      const gen = generation;
      mirror.onload = () => {
        if (gen !== generation) return;
        onFrame();
      };
      mirror.onerror = () => {
        if (gen !== generation) return;
        scheduleRetry();
      };
      mirror.src = withCacheBust(streamURL);
    }

    function onFrame() {
      retries = 0;
      gotFrame = true;
      setOverlay('');
      showStage();
      liveBadge.classList.add('show');
      clearTimeout(badgeTimer);
      badgeTimer = setTimeout(() => liveBadge.classList.remove('show'), 4000);
      sendToPhone({ type: 'status', state: 'live' });
    }

    function scheduleRetry() {
      if (stopRequested || !streamURL) return;
      retries += 1;
      if (retries > MAX_RETRIES) {
        fail();
        return;
      }
      if (gotFrame) {
        setOverlay(COPY.reconnecting);
      } else {
        setCard('Connecting', 'Hang on, your iPhone is getting ready.', COPY.waitingFrame, { busy: true });
      }
      clearTimeout(retryTimer);
      const delay = Math.min(RETRY_BASE_MS * retries, RETRY_MAX_MS);
      retryTimer = setTimeout(() => {
        if (!stopRequested) loadStream();
      }, delay);
    }

    // Multipart MJPEG never fires `load` again, so detect a dead stream by
    // watching the connection: if the browser reports the image as broken, retry.
    function startStallWatch() {
      clearInterval(stallTimer);
      stallTimer = setInterval(() => {
        if (stopRequested || !streamURL) return;
        if (mirror.complete && mirror.naturalWidth === 0) scheduleRetry();
      }, STALL_CHECK_MS);
    }

    function startStream(url) {
      if (!url || typeof url !== 'string') return;
      // Same stream already running: keep it, avoids flicker on duplicate sends.
      if (url === streamURL && !stopRequested && gotFrame) return;

      generation += 1;
      clearTimers();
      streamURL = url;
      stopRequested = false;
      retries = 0;
      gotFrame = false;
      mirror.removeAttribute('src');

      setOverlay('');
      liveBadge.classList.remove('show');
      showCard();
      setCard('Connecting', 'Hang on, your iPhone is getting ready.', COPY.connecting, { busy: true });

      loadStream();
      startStallWatch();
    }

    function stopStream(message) {
      generation += 1;
      stopRequested = true;
      clearTimers();
      streamURL = null;
      gotFrame = false;
      mirror.onload = mirror.onerror = null;
      mirror.removeAttribute('src');
      setOverlay('');
      liveBadge.classList.remove('show');
      showCard();
      setCard('Ready on this TV', 'Your iPhone screen will appear here.', message || COPY.idle);
    }

    function fail() {
      generation += 1;
      clearTimers();
      mirror.onload = mirror.onerror = null;
      mirror.removeAttribute('src');
      setOverlay('');
      showCard();
      setCard('Connection problem', 'The TV could not reach your iPhone.', COPY.failed, { error: true });
      sendToPhone({ type: 'status', state: 'error' });
    }

    context.addCustomMessageListener(NAMESPACE, (event) => {
      let data = event.data;
      try {
        if (typeof data === 'string') data = JSON.parse(data);
      } catch (e) {
        console.error('Invalid cast message', e);
        return;
      }
      if (!data) return;
      switch (data.type) {
        case 'stream': startStream(data.url); break;
        case 'stop': stopStream(COPY.stopped); break;
        case 'ping': sendToPhone({ type: 'status', state: gotFrame ? 'live' : 'idle' }); break;
      }
    });

    // The ReplayKit broadcast keeps running while the app is backgrounded, so
    // a sender disconnect must not blank a live mirror.
    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
      if (!stopRequested && gotFrame) {
        setOverlay(COPY.phoneAway);
        return;
      }
      if (context.getSenders().length === 0) stopStream(COPY.idle);
    });

    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
      if (stopRequested) setCard('Ready on this TV', 'Your iPhone screen will appear here.', COPY.connecting, { busy: true });
    });

    const options = new cast.framework.CastReceiverOptions();
    options.maxInactivity = 3600;
    options.disableIdleTimeout = true;
    options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
    context.start(options);
  </script>
</body>
</html>
