<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Screen Mirror</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root {
      --bg: #000D1D;
      --card: rgba(8, 25, 45, 0.88);
      --blue: #148DFF;
      --blue-dark: #0265C2;
      --blue-soft: #9EC7F9;
      --text: #FFFFFF;
      --muted: #8FA6BF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(1200px 700px at 12% -8%, rgba(20, 141, 255, 0.28), transparent 55%),
        radial-gradient(900px 600px at 108% 8%, rgba(2, 101, 194, 0.32), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #waiting {
      max-width: 760px;
      padding: 3rem 2.75rem;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(2, 101, 194, 0.28);
    }
    .brand-mark {
      width: 76px;
      height: 76px;
      margin-bottom: 1.4rem;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      box-shadow: 0 10px 30px rgba(20, 141, 255, 0.4);
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 19px;
      border: 3px solid #fff;
      border-radius: 8px;
    }
    .eyebrow {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 0.7rem;
    }
    #waiting h1 { font-size: 3rem; font-weight: 700; margin-bottom: 0.7rem; }
    #waiting .subtitle { color: var(--muted); font-size: 1.25rem; line-height: 1.45; margin-bottom: 1.4rem; }
    #status { color: var(--blue-soft); font-size: 1.15rem; }
    #video-container {
      display: none;
      width: 100vw;
      height: 100vh;
      background: #000;
      position: fixed;
      inset: 0;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #video-status {
      position: fixed;
      left: 50%;
      bottom: 1.8rem;
      transform: translateX(-50%);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      z-index: 2;
      pointer-events: none;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      min-width: 4.5rem;
      text-align: center;
    }
    #video-status:empty { display: none; }
  </style>
</head>
<body>
  <div id="waiting">
    <div class="brand-mark" aria-hidden="true"></div>
    <p class="eyebrow">Screen Mirror</p>
    <h1>Ready on this TV</h1>
    <p class="subtitle">Your iPhone screen will appear here.</p>
    <p id="status">Open Screen Mirror on your iPhone and connect to this TV.</p>
  </div>
  <div id="video-container">
    <video id="remote-video" autoplay playsinline muted></video>
    <p id="video-status"></p>
  </div>

  <script>
    const CUSTOM_CHANNEL = 'urn:x-cast:com.screenmirror.live';
    // Same-LAN Chromecast <-> iPhone: host candidates only (matches the iOS sender).
    const RTC_CONFIG = { iceServers: [] };
    const COPY = {
      idle: 'Open Screen Mirror on your iPhone and connect to this TV.',
      waitingPhone: 'Waiting for Screen Mirror on your iPhone…',
      waitingBroadcast: 'Waiting for screen broadcast from your iPhone…',
      readyBroadcast: 'Connected. Tap Start Broadcast on your iPhone.',
      connecting: 'Starting screen mirror…',
      connected: 'Mirroring live',
      decoding: 'Connected — preparing the picture…',
      waitingFrame: 'Waiting for first frame…',
      waitingVideo: 'Connected — waiting for video…',
      reconnecting: 'Reconnecting…',
      background: 'iPhone is in the background — mirroring continues',
      receiving: 'Receiving stream…',
      live: 'Live',
    };

    let sessionId = null;
    let signalingHost = null;
    let signalingPort = null;
    let peerConnection = null;
    let icePollTimer = null;
    let sessionRequestTimer = null;
    let webRtcStartInProgress = false;
    let webRtcStarted = false;
    let blackScreenWatchdog = null;
    let mirrorStopRequested = false;
    let webRtcGeneration = 0;

    const context = cast.framework.CastReceiverContext.getInstance();
    const remoteVideo = document.getElementById('remote-video');
    const videoStatus = document.getElementById('video-status');

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function showWaiting() {
      document.getElementById('waiting').style.display = 'block';
      document.getElementById('video-container').style.display = 'none';
    }

    function showVideo() {
      document.getElementById('waiting').style.display = 'none';
      document.getElementById('video-container').style.display = 'block';
    }

    function clearVideoElement() {
      try { remoteVideo.pause(); } catch (e) {}
      remoteVideo.srcObject = null;
      remoteVideo.removeAttribute('src');
      try { remoteVideo.load(); } catch (e) {}
      videoStatus.textContent = '';
    }

    function stopMirrorSurface() {
      mirrorStopRequested = true;
      resetWebRtc({ keepSession: true, clearFrame: true });
      showWaiting();
      setStatus(sessionId ? COPY.readyBroadcast : COPY.idle);
    }

    function resetWebRtc({ keepSession = true, clearFrame = true } = {}) {
      webRtcGeneration += 1;
      if (icePollTimer) {
        clearInterval(icePollTimer);
        icePollTimer = null;
      }
      if (blackScreenWatchdog) {
        clearTimeout(blackScreenWatchdog);
        blackScreenWatchdog = null;
      }
      if (peerConnection) {
        try { peerConnection.close(); } catch (e) {}
        peerConnection = null;
      }
      webRtcStarted = false;
      webRtcStartInProgress = false;
      if (clearFrame) {
        clearVideoElement();
      } else {
        remoteVideo.srcObject = null;
        videoStatus.textContent = '';
      }
      document.getElementById('video-container').style.display = 'none';
      document.getElementById('waiting').style.display = 'block';
      if (keepSession && sessionId) {
        setStatus(mirrorStopRequested ? COPY.readyBroadcast : COPY.waitingBroadcast);
      } else if (!sessionId) {
        setStatus(COPY.idle);
      }
    }

    function attachVideoStream(stream) {
      remoteVideo.srcObject = stream;
      // Chromecast often skips decoding while the <video> is display:none.
      showVideo();
      remoteVideo.muted = true;
      try { remoteVideo.setAttribute('playsinline', 'true'); } catch (_) {}
      try { remoteVideo.autoplay = true; } catch (_) {}

      const markLive = () => {
        setStatus(COPY.connected);
        videoStatus.textContent = COPY.live;
        remoteVideo.muted = false;
        if (blackScreenWatchdog) {
          clearTimeout(blackScreenWatchdog);
          blackScreenWatchdog = null;
        }
      };

      remoteVideo.onplaying = markLive;
      remoteVideo.onloadeddata = () => { if (remoteVideo.videoWidth > 0) markLive(); };
      remoteVideo.onresize = () => { if (remoteVideo.videoWidth > 0) markLive(); };

      const playPromise = remoteVideo.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => {
          if (remoteVideo.videoWidth > 0) {
            markLive();
          } else {
            setStatus(COPY.decoding);
            videoStatus.textContent = COPY.receiving;
          }
        }).catch((e) => {
          console.warn('video.play failed, retrying muted', e);
          remoteVideo.muted = true;
          remoteVideo.play().catch(() => {});
        });
      } else {
        setStatus(COPY.decoding);
      }

      if (blackScreenWatchdog) clearTimeout(blackScreenWatchdog);
      const playRetry = setInterval(() => {
        if (remoteVideo.videoWidth > 0) {
          clearInterval(playRetry);
          return;
        }
        remoteVideo.muted = true;
        remoteVideo.play().catch(() => {});
      }, 1500);
      blackScreenWatchdog = setTimeout(() => {
        clearInterval(playRetry);
        if (!remoteVideo.videoWidth) {
          // Soft tip only — keep trying; the first keyframe can take a while.
          videoStatus.textContent = COPY.waitingFrame;
          setStatus(COPY.waitingVideo);
        }
      }, 20000);
    }

    function applySessionPrepare(data) {
      if (!data || !data.sessionId || !data.signalingHost || !data.signalingPort) return false;

      const sameSession =
        sessionId === data.sessionId &&
        signalingHost === data.signalingHost &&
        signalingPort === data.signalingPort;

      mirrorStopRequested = false;
      sessionId = data.sessionId;
      signalingHost = data.signalingHost;
      signalingPort = data.signalingPort;
      stopSessionPrepareRequests();

      if (data.startMirroring === true) {
        // Never tear down an in-flight WebRTC for duplicate startMirroring messages.
        const state = peerConnection ? peerConnection.connectionState : '';
        const failed = state === 'failed' || state === 'closed';
        if (sameSession && !failed && (peerConnection || webRtcStartInProgress || webRtcStarted)) {
          return true;
        }
        resetWebRtc({ keepSession: true, clearFrame: true });
        sessionId = data.sessionId;
        signalingHost = data.signalingHost;
        signalingPort = data.signalingPort;
        setStatus(COPY.connecting);
        void startWebRtc();
        return true;
      }

      // Credentials only — wait for the user to start the screen broadcast.
      if (!sameSession) {
        resetWebRtc({ keepSession: false, clearFrame: true });
        sessionId = data.sessionId;
        signalingHost = data.signalingHost;
        signalingPort = data.signalingPort;
      }
      setStatus(COPY.readyBroadcast);
      // The phone app is suspended while the broadcast picker is open, so it cannot tell us
      // when the offer is ready. Poll for it ourselves instead of waiting for startMirroring.
      if (!peerConnection && !webRtcStartInProgress && !webRtcStarted) {
        void startWebRtc();
      }
      return true;
    }

    context.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.type === 'session_prepare') {
          applySessionPrepare(data);
        } else if (data.type === 'mirror_stop' || data.type === 'stop') {
          stopMirrorSurface();
        }
      } catch (e) {
        console.error('Invalid cast message', e);
      }
    });

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function signalingUrl(path) {
      return `http://${signalingHost}:${signalingPort}${path}`;
    }

    async function postJson(path, body, query = '') {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500);
      try {
        return await fetch(signalingUrl(path + query), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function getJson(path) {
      const controller = new AbortController();
      // Short timeout: without a listener, a Chromecast TCP connect can hang 10-20s.
      const timer = setTimeout(() => controller.abort(), 800);
      try {
        const res = await fetch(signalingUrl(path), { signal: controller.signal });
        if (res.status === 204 || !res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    function sendCastMessage(payload) {
      context.sendCustomMessage(CUSTOM_CHANNEL, payload);
    }

    function startSessionPrepareRequests() {
      stopSessionPrepareRequests();
      sendCastMessage({ type: 'request_session_prepare' });
      sessionRequestTimer = setInterval(() => {
        if (!sessionId) sendCastMessage({ type: 'request_session_prepare' });
      }, 1500);
    }

    function stopSessionPrepareRequests() {
      if (sessionRequestTimer) {
        clearInterval(sessionRequestTimer);
        sessionRequestTimer = null;
      }
    }

    async function waitForOffer() {
      // Poll quickly so mirroring appears almost immediately after the broadcast starts.
      for (let i = 0; i < 400; i++) {
        if (mirrorStopRequested) throw new Error('Mirror stop requested');
        const msg = await getJson(`/sdp/offer?sessionId=${encodeURIComponent(sessionId)}`);
        if (msg && msg.type === 'offer' && msg.sdp) return msg.sdp;
        await sleep(50);
      }
      throw new Error('Offer timeout');
    }

    function startIcePolling() {
      if (icePollTimer) clearInterval(icePollTimer);
      icePollTimer = setInterval(async () => {
        try {
          const list = await getJson(`/ice?sessionId=${encodeURIComponent(sessionId)}&side=sender`);
          if (!list || !list.candidates) return;
          for (const c of list.candidates) {
            await peerConnection.addIceCandidate({
              candidate: c.candidate,
              sdpMid: c.sdpMid,
              sdpMLineIndex: c.sdpMLineIndex,
            });
          }
        } catch (e) {
          console.warn('ICE poll error', e);
        }
      }, 100);
    }

    async function startWebRtc() {
      if (!sessionId || !signalingHost || !signalingPort) return;
      if (peerConnection || webRtcStartInProgress || webRtcStarted) return;
      if (mirrorStopRequested) return;

      const generation = webRtcGeneration;
      webRtcStartInProgress = true;
      setStatus(COPY.waitingBroadcast);

      try {
        const offerSdp = await waitForOffer();
        if (mirrorStopRequested || generation !== webRtcGeneration) return;

        peerConnection = new RTCPeerConnection(RTC_CONFIG);
        peerConnection.ontrack = (event) => {
          if (generation !== webRtcGeneration) return;
          if (event.track) event.track.enabled = true;
          // Unified Plan sometimes delivers tracks with an empty streams array.
          const stream = (event.streams && event.streams[0])
            ? event.streams[0]
            : (event.track ? new MediaStream([event.track]) : null);
          if (!stream) return;
          const hasVideo = stream.getVideoTracks().length > 0 || event.track?.kind === 'video';
          if (!hasVideo && remoteVideo.srcObject) return;
          attachVideoStream(stream);
        };

        peerConnection.onconnectionstatechange = () => {
          if (generation !== webRtcGeneration) return;
          const state = peerConnection?.connectionState;
          if (state === 'connected' && remoteVideo.videoWidth > 0) {
            videoStatus.textContent = COPY.live;
          } else if (state === 'connecting') {
            videoStatus.textContent = COPY.connecting;
          } else {
            videoStatus.textContent = '';
          }
          if (state === 'connected') {
            // ICE "connected" is not a picture yet — only claim Live when frames decode.
            setStatus(remoteVideo.videoWidth > 0 ? COPY.connected : COPY.waitingVideo);
          }
          if (state === 'disconnected') {
            // Transient — ICE often recovers on its own. Tearing down here would re-fetch the
            // sender's one-shot offer and post an answer it never reads, blanking the TV.
            if (!mirrorStopRequested && remoteVideo.videoWidth === 0) setStatus(COPY.reconnecting);
            return;
          }
          if (state === 'failed' || state === 'closed') {
            if (mirrorStopRequested || state === 'closed') {
              resetWebRtc({ keepSession: true, clearFrame: true });
              showWaiting();
              setStatus(sessionId ? COPY.readyBroadcast : COPY.idle);
              return;
            }
            resetWebRtc({ keepSession: true, clearFrame: true });
            setTimeout(() => {
              if (sessionId && !webRtcStarted && !webRtcStartInProgress && !mirrorStopRequested) {
                void startWebRtc();
              }
            }, 800);
          }
        };

        peerConnection.onicecandidate = (event) => {
          if (!event.candidate || generation !== webRtcGeneration) return;
          postJson('/ice', {
            sessionId,
            candidate: event.candidate.candidate,
            sdpMid: event.candidate.sdpMid,
            sdpMLineIndex: event.candidate.sdpMLineIndex,
          }, '?side=receiver').catch(console.error);
        };

        await peerConnection.setRemoteDescription({ type: 'offer', sdp: offerSdp });
        if (generation !== webRtcGeneration) return;
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        if (generation !== webRtcGeneration) return;

        await postJson('/sdp', { sessionId, type: 'answer', sdp: answer.sdp });

        startIcePolling();
        webRtcStarted = true;
      } catch (e) {
        if (generation !== webRtcGeneration) return;
        console.error('startWebRtc failed', e);
        resetWebRtc({ keepSession: true, clearFrame: true });
        if (!mirrorStopRequested) {
          setStatus(COPY.waitingBroadcast);
          setTimeout(() => {
            if (sessionId && !webRtcStarted && !webRtcStartInProgress && !mirrorStopRequested) {
              void startWebRtc();
            }
          }, 400);
        }
      } finally {
        if (generation === webRtcGeneration) webRtcStartInProgress = false;
      }
    }

    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
      setStatus(COPY.waitingPhone);
      startSessionPrepareRequests();
    });

    if (context.getSenders().length > 0) {
      startSessionPrepareRequests();
    }

    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
      // The ReplayKit broadcast runs in its own process and WebRTC media does not need the
      // Cast sender, so a backgrounded or force-quit app must not tear down a live mirror.
      if (peerConnection || webRtcStarted || webRtcStartInProgress || remoteVideo.srcObject) {
        if (remoteVideo.srcObject) setStatus(COPY.background);
        return;
      }
      if (sessionId && !mirrorStopRequested) return;
      stopSessionPrepareRequests();
      resetWebRtc({ keepSession: false });
      sessionId = null;
      signalingHost = null;
      signalingPort = null;
      setStatus(COPY.idle);
    });

    context.start({
      disableIdleTimeout: true,
      maxInactivity: 3600,
      customNamespaces: { [CUSTOM_CHANNEL]: cast.framework.system.MessageType.JSON },
    });
  </script>
</body>
</html>
